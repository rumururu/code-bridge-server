<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Code Bridge</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, sans-serif;
        color: #203c3c;
        background: #f6f7f2;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button, input, select, textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
        border: 1px solid #c6d3c3;
        background: #fff;
        border-radius: 9px;
        padding: 8px 12px;
        color: #294c40;
      }
      button:hover, a:hover {
        border-color: #668b62;
        color: #376b50;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      a {
        color: #376b50;
        text-decoration: none;
        overflow-wrap: anywhere;
      }
      nav {
        position: fixed;
        inset: 0 auto 0 0;
        width: 218px;
        background: #173d39;
        color: #e7eee8;
        padding: 25px 15px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      nav strong {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px 28px;
        letter-spacing: 0.04em;
      }
      nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        color: #c5d8cd;
        padding: 11px 13px;
        border-radius: 9px;
      }
      nav a.active, nav a:hover {
        background: #31564b;
        color: #fff;
      }
      nav .bottom {
        margin-top: auto;
      }
      main {
        margin-left: 218px;
        padding: 28px clamp(18px, 4vw, 56px);
        max-width: 1600px;
      }
      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 27px;
        margin: 0 0 5px;
      }
      h2 {
        font-size: 18px;
        margin: 0 0 15px;
      }
      h3 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
      }
      small, .muted {
        color: #667b70;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e7e1;
        border-radius: 15px;
        padding: 20px;
        min-width: 0;
        box-shadow: 0 5px 22px #244b3005;
      }
      .wide {
        grid-column: 1/-1;
      }
      .row {
        display: flex;
        gap: 9px;
        align-items: center;
        flex-wrap: wrap;
      }
      .split {
        display: grid;
        grid-template-columns: minmax(230px, 330px) minmax(0, 1fr);
        gap: 16px;
      }
      .item {
        display: block;
        width: 100%;
        text-align: left;
        border: 1px solid #e3e9df;
        border-radius: 10px;
        padding: 12px;
        margin: 7px 0;
        background: #fff;
      }
      .item.selected {
        border-color: #7b9f71;
        background: #eff5e9;
      }
      .badge {
        display: inline-block;
        border-radius: 30px;
        background: #eaf1e6;
        padding: 3px 9px;
        font-size: 12px;
        margin-right: 7px;
      }
      .error {
        color: #ad3536;
        background: #fff1ef;
        padding: 10px;
        border-radius: 8px;
      }
      .notice {
        background: #fff8e8;
        padding: 10px;
        border-radius: 8px;
      }
      .success {
        color: #13765f;
      }
      input, select, textarea {
        border: 1px solid #c6d3c3;
        border-radius: 8px;
        padding: 9px;
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 105px;
      }
      label {
        display: block;
        margin: 11px 0 5px;
        font-weight: 600;
      }
      dl {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 8px;
      }
      dt {
        color: #667b70;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f1f4ec;
        padding: 12px;
        border-radius: 8px;
        max-height: 420px;
        overflow: auto;
      }
      iframe {
        border: 0;
        width: 100%;
        height: calc(100vh - 155px);
        min-height: 620px;
        background: #fff;
        border-radius: 12px;
      }
      .hidden {
        display: none !important;
      }
      .list {
        max-height: 70vh;
        overflow: auto;
      }
      .line {
        border-top: 1px solid #e4eade;
        padding: 10px 0;
      }
      .frame-links {
        margin-bottom: 12px;
      }
      .nav-icon { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .brand-icon { width: 28px; height: 28px; color: #d7e6c9; }
      button:focus-visible, a:focus-visible { outline: 3px solid #c68b46; outline-offset: 4px; }
      .connection-overview { margin-bottom: 20px; border: 1px solid #dce3d3; border-radius: 17px; background: #e9eee1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(180px, 1fr); align-items: center; overflow: hidden; }
      .connection-copy { padding: 27px 30px; min-width: 0; }
      .connection-copy h2 { font-size: 23px; letter-spacing: -.5px; margin: 12px 0; overflow-wrap: anywhere; }
      .connection-copy p { color: #526a56; margin: 8px 0; }
      .connection-copy .row { margin-top: 19px; }
      .connection-overview img { width: 100%; height: 250px; object-fit: contain; }
      .connection-eyebrow { color: #526e54; font-size: 11px; letter-spacing: 1px; }
      .connection-metrics { display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 14px 0 0; font-size: 13px; }
      .connection-metrics div { display: flex; gap: 7px; }
      .connection-metrics dt { color: #526a56; }
      .connection-metrics dd { font-weight: 600; }
      .action-link { display: inline-flex; border: 1px solid #c6d3c3; border-radius: 9px; padding: 8px 13px; background: #fff; }
      .action-link.primary { color: #fff; background: #265c52; border-color: #265c52; }
      .frame-links { display: flex; gap: 8px; flex-wrap: wrap; }
      @media (max-width: 900px) { .connection-overview { grid-template-columns: 1fr; } .connection-overview img { height: 190px; } .connection-copy { padding: 23px 24px 0; } }
      @media (max-width: 760px) {
        nav {
          position: static;
          width: auto;
          padding: 12px;
          flex-direction: row;
          flex-wrap: wrap;
        }
        nav strong {
        display: flex;
        align-items: center;
        gap: 10px;
          width: 100%;
          padding: 2px 6px;
        }
        nav .bottom {
          margin: 0;
        }
        nav a {
          padding: 7px 9px;
        }
        main {
          margin: 0;
          padding: 18px;
        }
        .grid, .split {
          grid-template-columns: 1fr;
        }
        header {
          flex-direction: column;
          align-items: stretch;
        }
        header > .row {
          justify-content: space-between;
        }
        iframe {
          height: 75vh;
        }
      }
    </style>
  </head>
  <body>
    <nav aria-label="주 메뉴">
      <strong><svg class="nav-icon brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20V6h5v14M17 20V6h5v14M7 9c3 7 7 7 10 0M2 20h20"/></svg>Code Bridge</strong><a href="/dashboard" data-nav><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3ZM9 20v-7h6v7"/></svg>개요</a><a
        href="/inbox"
        data-nav
      ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l2 13v3H2v-3ZM2 15h6l2 3h4l2-3h6"/></svg>수신함</a><a href="/projects" data-nav><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v12H3ZM3 6V3h7l2 3h9v3"/></svg>프로젝트</a><a
        href="/agents"
        data-nav
      ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2h8v6H8ZM12 8v5H5v4m7-4h7v4M2 17h6v5H2ZM16 17h6v5h-6Z"/></svg>자동화</a><a href="/settings" data-nav class="bottom"
      ><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v7H3ZM3 14h18v7H3ZM7 6h1m4 0h5M7 17h1m4 0h5"/></svg>서버 관리</a>
    </nav>
    <main>
      <header>
        <div><h1 id="title"></h1><small id="subtitle"></small></div>
        <div class="row">
          <small id="updated"></small><button id="refresh">새로고침</button>
        </div>
      </header>
      <div id="status" role="status"></div>
      <section id="content"></section>
      <section id="agentsFrame" class="hidden">
        <div class="frame-links">
          <a href="/agents?embedded=1" target="_blank"
          >자동화 단독 화면</a>
        </div>
      </section>
      <section id="settingsFrame" class="hidden">
        <div class="frame-links">
          <button data-settings="connection">연결·페어링</button>
          <button data-settings="environment">실행 환경</button>
          <button id="browserSetup">브라우저 설정</button>
          <button data-settings="access">접근 권한</button>
          <button data-settings="diagnostics">진단·로그</button>
        </div>
      </section>
    </main>
    <script>
      /* APPROVAL_REVIEW_MODULE */
      /* BROWSER_HANDOFF_MODULE */
      let browserHandoff = null;
      function closeBrowserHandoff() {
        browserHandoff?.close();
        browserHandoff = null;
      }
      window.addEventListener("pagehide", closeBrowserHandoff);
      const base = "/api/dashboard/agent";
      const state = {
        path: "",
        generation: 0,
        overview: null,
        overviewTime: null,
        items: null,
        inboxTotal: 0,
        inboxCursor: null,
        selected: null,
        managementSection: "connection",
        projects: null,
        project: "",
        projectHistoryCursor: null,
        projectDrafts: Object.create(null),
        taskAttempts: restoreTaskAttempts(),
        checkpointDrafts: Object.create(null),
        artifactRequest: 0,
        run: null,
      };
      const $ = (s) => document.querySelector(s);
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c]),
        );
      const date = (s) => s ? new Date(s).toLocaleString("ko-KR") : "미확인";
      const errorText = (e) =>
        e.status === 401 || e.status === 403
          ? "접근 권한이 없습니다."
          : e.status === 404
          ? "대상을 찾을 수 없습니다."
          : e.message || "요청에 실패했습니다.";
      async function api(path, options = {}) {
        const response = await fetch(path, {
          credentials: "same-origin",
          ...options,
          headers: {
            ...(options.body ? { "Content-Type": "application/json" } : {}),
            ...options.headers,
          },
        });
        let data;
        try {
          data = await response.json();
        } catch {
          data = {};
        }
        if (!response.ok) {
          const e = new Error(
            typeof data.detail === "string"
              ? data.detail
              : typeof data.error === "string"
              ? data.error
              : `HTTP ${response.status}`,
          );
          e.status = response.status;
          throw e;
        }
        return data;
      }
      function status(message, kind = "") {
        const node = $("#status");
        node.innerHTML = message
          ? `<p class="${kind}">${esc(message)}</p>`
          : "";
      }
      function linkRun(id) {
        return id
          ? `<a href="/runs/${encodeURIComponent(id)}" data-link>실행 ${
            esc(id)
          }</a>`
          : "연결된 실행 없음";
      }
      function runStatus(status) {
        return ({
          queued: "대기",
          starting: "시작 중",
          running: "실행 중",
          paused: "일시중지",
          completed: "완료",
          failed: "실패",
          cancelled: "취소",
          waiting_for_user: "응답 대기",
        })[status] || status || "미확인";
      }
      function runLink(run) {
        const title = run.title || run.goal || run.project_name || "실행";
        const shortId = String(run.id || "").slice(0, 12);
        return `<a href="/runs/${encodeURIComponent(run.id)}" data-link>${
          esc(title)
        }</a>
          <small title="${esc(run.id)}">${esc(shortId)}</small>`;
      }
      function itemLine(x) {
        return `<div class="line"><span class="badge">${
          esc(x.status || x.kind || "")
        }</span>${linkRun(x.id || x.run_id)} <small>${
          date(x.created_at || x.updated_at)
        }</small></div>`;
      }
      function navigate(path, replace = false) {
        if (state.path === "/projects") saveVisibleDraft(state.project);
        if (replace) history.replaceState(null, "", path);
        else history.pushState(null, "", path);
        renderRoute();
      }
      function frame(name) {
        const host = $("#" + name + "Frame");
        if (!host.querySelector("iframe")) {
          const f = document.createElement("iframe");
          f.src = name === "agents"
            ? "/agents?embedded=1"
            : "/settings?embedded=1";
          f.title = name === "agents" ? "자동화" : "서버 관리";
          host.append(f);
        }
        return host;
      }
      function show(title, subtitle = "", fr = null) {
        $("#title").textContent = title;
        $("#subtitle").textContent = subtitle;
        $("#content").classList.toggle("hidden", !!fr);
        $("#agentsFrame").classList.toggle("hidden", fr !== "agents");
        $("#settingsFrame").classList.toggle("hidden", fr !== "settings");
        $("#updated").textContent = "";
        $("#refresh").classList.toggle("hidden", !!fr);
        document.querySelectorAll("[data-nav]").forEach((a) =>
          a.classList.toggle(
            "active",
            a.getAttribute("href") ===
              (fr === "agents"
                ? "/agents"
                : fr === "settings"
                ? "/settings"
                : location.pathname),
          )
        );
      }
      function renderRoute() {
        closeBrowserHandoff();
        state.path = location.pathname;
        const ticket = ++state.generation;
        status("");
        const path = state.path;
        if (path === "/dashboard") {
          show("개요", "현재 처리와 실행 상태");
          loadOverview(ticket);
        } else if (path === "/inbox") {
          show("수신함", "결정과 응답이 필요한 항목");
          loadInbox(ticket);
        } else if (path === "/projects") {
          show("프로젝트", "작업과 실행 기록");
          loadProjects(ticket);
        } else if (path === "/agents") {
          show("자동화", "에이전트 · 워크플로 · 예약 · 스크립트", "agents");
          frame("agents");
          const agentSection = new URLSearchParams(location.search).get(
            "section",
          );
          const agentId = new URLSearchParams(location.search).get("agentId");
          if (agentSection || agentId) {
            sendFrameSection(frame("agents"), agentSection, agentId);
          }
        } else if (path === "/settings") {
          show("서버 관리", "연결 · 실행 환경 · 접근 권한 · 진단", "settings");
          const requested = new URLSearchParams(location.search).get("section");
          if (
            ["connection", "environment", "access", "diagnostics"].includes(
              requested,
            )
          ) {
            state.managementSection = requested;
          }
          sendFrameSection(
            frame("settings"),
            state.managementSection,
          );
        } else if (path.startsWith("/runs/")) {
          show("실행 상세", decodeURIComponent(path.slice(6)));
          loadRun(decodeURIComponent(path.slice(6)), ticket);
        } else navigate("/dashboard", true);
      }
      function current(ticket) {
        return ticket === state.generation;
      }
      function connectionOverview(result) {
        const data = result.status === "fulfilled" ? result.value : null;
        const server = data?.server;
        const listening = server?.api_listening;
        const apiStatus = listening === true ? "API 연결됨" : listening === false ? "API 연결 확인 필요" : "API 상태 미확인";
        const tunnelStatus = data?.tunnel?.running === true ? "터널 실행 중" : data?.tunnel?.running === false ? "터널 중지됨" : "터널 상태 미확인";
        const count = (value) => Number.isInteger(value) && value >= 0 ? `${value}대` : "미확인";
        return `<article class="connection-overview" aria-label="서버 연결 요약"><div class="connection-copy"><span class="connection-eyebrow">서버 연결</span><h2>${esc(server?.server_name || "개발 서버")}</h2><p>${data ? `${apiStatus} · ${tunnelStatus}` : "서버 상태를 불러오지 못했습니다."}</p><dl class="connection-metrics"><div><dt>페어링 등록</dt><dd>${count(data?.pairing?.active_clients)}</dd></div><div><dt>개발 기기</dt><dd>${count(data?.devices?.total)}</dd></div></dl><div class="row"><a class="action-link primary" href="/settings?section=connection" data-link>연결·페어링 관리</a><a class="action-link" href="/settings?section=environment" data-link>개발 기기 확인</a></div></div><img src="/dashboard/assets/server-device-v1.png" alt="" width="1536" height="1024"></article>`;
      }
      async function loadOverview(ticket) {
        const root = $("#content");
        root.innerHTML = "<p>불러오는 중…</p>";
        const [overview, server] = await Promise.allSettled([
          api(base + "/overview"),
          api("/api/system/overview"),
        ]);
        if (!current(ticket)) return;
        if (overview.status === "fulfilled") {
          state.overview = mergeOverview(state.overview, overview.value);
          if (!(overview.value.section_errors || []).length) {
            state.overviewTime = Date.now();
          }
        }
        const o = state.overview;
        const errors = overview.status === "fulfilled"
          ? overview.value.section_errors || []
          : [];
        const fail = overview.status === "rejected"
          ? "개요 조회 실패: " + errorText(overview.reason)
          : errors.length
          ? "일부 항목 조회 실패: " + errors.join(", ")
          : "";
        $("#updated").textContent = state.overviewTime
          ? "개요 마지막 성공 " + date(state.overviewTime)
          : overview.status === "fulfilled"
          ? "조회 시각 " + date(overview.value.as_of)
          : "";
        root.innerHTML = o
          ? `<div class="grid"><article class="card"><h2>처리할 항목</h2><p>${
            o.action_count === null
              ? "조회 실패"
              : esc(o.action_count ?? "미확인")
          }</p><a href="/inbox" data-link>수신함 열기</a></article><article class="card"><h2>실행 중 작업</h2>${
            listRuns(o.running)
          }</article><article class="card"><h2>최근 결과</h2>${
            listRuns(o.recent)
          }</article><article class="card"><h2>다음 예약</h2>${
            o.next_schedules?.length
              ? o.next_schedules.map((s) =>
                `<div class="line">${esc(s.name || s.task_id || s.id)} <small>${
                  date(s.next_run_at)
                }</small></div>`
              ).join("")
              : o.next_schedules === null
              ? "조회 실패"
              : "예약 없음"
          }</article><article class="card wide"><h2>서버·CLI</h2>${
            server.status === "fulfilled"
              ? `<p>서버: ${
                esc(server.value.server?.status || "미확인")
              } · API: ${
                server.value.server?.api_listening ? "연결됨" : "연결 확인 필요"
              }</p><p>CLI: ${
                server.value.llm?.connected ? "연결됨" : "연결 확인 필요"
              }</p>`
              : `상태 조회 실패: ${
                esc(errorText(server.reason))
              } · <a href="/settings" data-link>접근 설정</a>`
          } <a href="/settings" data-link>서버 관리</a></article></div>`
          : `<p class="error">개요를 불러오지 못했습니다: ${
            esc(
              overview.status === "rejected"
                ? errorText(overview.reason)
                : "조회 실패",
            )
          }</p>`;
        root.innerHTML = connectionOverview(server) + root.innerHTML;
        if (fail || server.status === "rejected") {
          status(
            [
              fail,
              server.status === "rejected"
                ? "서버 상태 조회 실패: " + errorText(server.reason)
                : "",
            ]
              .filter(Boolean).join(" · ") +
              (state.overviewTime ? " · 이전 성공 자료 표시" : ""),
            "error",
          );
        }
      }
      function mergeOverview(previous, next) {
        if (!previous) {
          const result = { ...next };
          for (const section of next.section_errors || []) {
            result[section] = null;
          }
          return result;
        }
        const result = { ...next };
        for (const section of next.section_errors || []) {
          if (section === "action_count") {
            result.action_count = previous.action_count;
          } else if (section === "next_schedules") {
            result.next_schedules = previous.next_schedules;
          } else if (section in previous) result[section] = previous[section];
        }
        return result;
      }
      function listRuns(rows) {
        if (rows === null || rows === undefined) return "조회 실패";
        return rows.length
          ? rows.map((r) =>
            `<div class="line"><span class="badge">${
              esc(runStatus(r.status))
            }</span>${runLink(r)} <small>${
              esc(r.project_name || "")

        if (
          !attempt ||
          ["pending", "confirmed", "invalid"].includes(attempt.status)
        ) return false;
        const found = matchAttempt(tasks, attempt);
        if (found) {
          attempt.status = "confirmed";
          attempt.taskId = found.id;
          clearSubmittedDraft(project, attempt);
          return true;
        } else {
          attempt.status = tasks.length >= 200 ? "unverifiable" : "absent";
        }
        persistTaskAttempts();
        return false;
      }
      async function recheckAttempt(project) {
        const attempt = attemptFor(project);
        if (!attempt || attempt.status === "pending") return;
        attempt.status = "uncertain";
        if (state.project === project && state.path === "/projects") {
          updateProjectFormStatus(project);
        }
        try {
          const result = await api(
            base + "/tasks?project_name=" + encodeURIComponent(project) +
              "&limit=200",
          );
          reconcileAttempt(project, result.tasks || []);
        } catch {
          attempt.status = "query_failed";
        }
        if (state.project === project && state.path === "/projects") {
          updateProjectFormStatus(project);
          loadProjectItems(project, state.generation);
        }
      }
      async function loadProjectItems(project, ticket) {
        if (!project) {
          $("#projectTasks").textContent = "프로젝트를 선택하세요.";
          $("#projectRuns").textContent = "프로젝트를 선택하세요.";
          return;
        }
        const [tasks, history] = await Promise.allSettled([
          api(
            base + "/tasks?project_name=" + encodeURIComponent(project) +
              "&limit=200",
          ),
          api(
            base + "/history?project_name=" + encodeURIComponent(project) +
              "&limit=100",
          ),
        ]);
        if (tasks.status === "fulfilled") {
          reconcileAttempt(
            project,
            tasks.value.tasks || [],
          );
        } else if (attemptFor(project)?.status === "uncertain") {
          attemptFor(project).status = "query_failed";
        }
        if (
          !current(ticket) || state.project !== project ||
          state.path !== "/projects"
        ) return;
        const taskNode = $("#projectTasks");
        const runNode = $("#projectRuns");
        if (!taskNode || !runNode) return;
        taskNode.innerHTML = tasks.status === "fulfilled"
          ? ((tasks.value.tasks || []).map((task) =>
            `<div class="line"><strong>${
              esc(task.title)
            }</strong> <span class="badge">${esc(task.status)}</span><small>${
              esc(task.id)
            }</small><br>${
              task.run_id
                ? linkRun(task.run_id)
                : task.assigned_agent_id
                ? `<a href="/agents?agentId=${
                  encodeURIComponent(task.assigned_agent_id)
                }&section=runs" data-link>담당 자동화에서 실행</a>`
                : '<a href="/agents?section=create" data-link>자동화에서 실행 설정</a>'
            }</div>`
          ).join("") || "작업 없음")
          : "작업 조회 실패";
        runNode.innerHTML = history.status === "fulfilled"
          ? listRuns(history.value.runs)
          : "실행 기록 조회 실패";
        state.projectHistoryCursor = history.status === "fulfilled"
          ? history.value.next_cursor || null
          : null;
        if (history.status === "fulfilled") {
          $("#projectRunHeading").textContent = `실행 기록 ${
            history.value.total_count ?? (history.value.runs || []).length
          }건`;
          $("#projectRunsMore").classList.toggle(
            "hidden",
            !state.projectHistoryCursor,
          );
        }
        updateProjectFormStatus(project);
        if (tasks.status === "rejected" || history.status === "rejected") {
          status("프로젝트 일부 정보를 불러오지 못했습니다.", "error");
        } else {
          $("#updated").textContent = "마지막 갱신 " + date(Date.now());
        }
      }
      async function loadMoreProjectRuns() {
        const project = state.project;
        const cursor = state.projectHistoryCursor;
        const ticket = state.generation;
        if (!project || !cursor) return;
        const button = $("#projectRunsMore");
        button.disabled = true;
        try {
          const page = await api(
            base + "/history?project_name=" + encodeURIComponent(project) +
              "&limit=100&cursor=" + encodeURIComponent(cursor),
          );
          if (
            !current(ticket) || state.project !== project || !button.isConnected
          ) return;
          $("#projectRuns").insertAdjacentHTML(
            "beforeend",
            listRuns(page.runs || []),
          );
          state.projectHistoryCursor = page.next_cursor || null;
          button.classList.toggle("hidden", !state.projectHistoryCursor);
          button.disabled = false;
        } catch (error) {
          if (
            current(ticket) && state.project === project && button.isConnected
          ) {
            button.disabled = false;
            status("실행 기록 추가 조회 실패: " + errorText(error), "error");
          }
        }
      }
      function restoreTaskAttempts() {
        try {
          const saved = JSON.parse(sessionStorage.getItem("codeBridge.dashboard.taskAttempts.v1") || "{}");
          const restored = Object.create(null);
          for (const [project, attempt] of Object.entries(saved)) {
            if (!attempt || typeof attempt.id !== "string" || !attempt.payload) continue;
            restored[project] = { ...attempt, status: attempt.status === "pending" ? "uncertain" : attempt.status };
          }
          return restored;
        } catch (_) { return Object.create(null); }
      }
      function persistTaskAttempts() {
        try { sessionStorage.setItem("codeBridge.dashboard.taskAttempts.v1", JSON.stringify(state.taskAttempts)); }
        catch (_) { /* Recovery remains available in the current page. */ }
      }
      async function postAttempt(project, attempt, ticket) {
        attempt.status = "pending";
        persistTaskAttempts();
        if (current(ticket) && state.project === project) {
          updateProjectFormStatus(project);
        }
        try {
          const result = await api(base + "/tasks", {
            method: "POST",
            body: JSON.stringify(attempt.payload),
          });
          attempt.status = "confirmed";
          attempt.taskId = result.task?.id || "완료";
          clearSubmittedDraft(project, attempt);
        } catch (error) {
          attempt.status = [400, 422].includes(error.status)
            ? "invalid"
            : "uncertain";
        }
        persistTaskAttempts();
        if (
          current(ticket) && state.project === project &&
          state.path === "/projects"
        ) {
          updateProjectFormStatus(project);
          await loadProjectItems(project, ticket);
        }
      }
      async function submitTask() {
        const project = state.project;
        if (
          !project ||
          attemptFor(project) &&
            !["confirmed", "invalid"].includes(attemptFor(project).status)
        ) return;
        const draft = draftFor(project);
        const title = draft.title.trim();
        if (!title) return;
        const id = crypto.randomUUID();
        const attempt = {
          id,
          status: "pending",
          payload: {
            title,
            description: draft.description,
            project_name: project,
            metadata: { dashboard_request_id: id },
          },
        };
        state.taskAttempts[project] = attempt;
        await postAttempt(project, attempt, state.generation);
      }
      function sendFrameSection(frame, section, agentId) {
        const f = frame.querySelector("iframe");
        if (!f?.contentWindow) return;
        const invoke = () => {
          const child = f.contentWindow;
          if (typeof child.dashboardNavigate === "function") {
            Promise.resolve(child.dashboardReady).then(() =>
              child.dashboardNavigate({
                section,
                ...(agentId ? { agentId } : {}),
              })
            ).catch(() => status("내장 화면을 열지 못했습니다.", "error"));
          }
        };
        if (typeof f.contentWindow.dashboardNavigate === "function") invoke();
        else f.addEventListener("load", invoke, { once: true });
      }
      function openAutomation(section, agentId) {
        navigate("/agents");
        sendFrameSection(frame("agents"), section, agentId);
      }
      function openSettings(section) {
        state.managementSection = section;
        navigate("/settings");
      }
      window.addEventListener("message", (event) => {
        if (
          event.origin !== location.origin ||
          event.data?.type !== "dashboard:navigate"
        ) return;
        const sources = ["agentsFrame", "settingsFrame"].map((id) =>
          $("#" + id + " iframe")?.contentWindow
        );
        if (!sources.includes(event.source)) return;
        const path = event.data.path;
        if (
          typeof path !== "string" ||
          !/^\/(dashboard|inbox|projects|agents|settings|runs\/[^/?#]+)(?:\?[^#]*)?$/
            .test(path)
        ) return;
        navigate(path);
      });
      window.addEventListener("popstate", renderRoute);
      document.addEventListener("click", async (event) => {
        const a = event.target.closest("a[data-link],a[data-nav]");
        if (a) {
          event.preventDefault();
          navigate(a.getAttribute("href"));
          if (a.dataset.agent) {
            sendFrameSection(
              frame("agents"),
              a.dataset.section || "runs",
              a.dataset.agent,
            );
          }
          return;
        }
        if (event.target.id === "inboxMore") {
          await loadMoreInbox();
          return;
        }
        if (event.target.id === "eventsMore") {
          await loadMoreEvents(event.target);
          return;
        }
        if (event.target.id === "projectRunsMore") {
          await loadMoreProjectRuns();
          return;
        }
        if (event.target.id === "taskRecheck") {
          await recheckAttempt(state.project);
          return;
        }
        const item = event.target.closest("[data-item]");
        if (item) {
          selectItem(item.dataset.item);
          return;
        }
        const decision = event.target.closest("[data-decision]");
        if (decision) {
          await decide(decision.dataset.decision);
          return;
        }
        const resume = event.target.closest("[data-resume]");
        if (resume) {
          const ticket = state.generation;
          const selected = state.selected;
          resume.disabled = true;
          try {
            const r = await api(
              base + "/approvals/" + encodeURIComponent(resume.dataset.resume) +
                "/resume",
              { method: "POST" },
            );
            if (
              current(ticket) && state.path === "/inbox" &&
              state.selected === selected
            ) {
              await loadInbox(ticket);
              if (current(ticket)) {
                status("재개 상태: " + r.resume_status, "success");
              }
            }
          } catch (e) {
            if (current(ticket) && state.selected === selected) {
              const result = $("#actionResult");
              if (result) result.textContent = errorText(e);
              resume.disabled = false;
            }
          }
          return;
        }
        const response = event.target.closest("[data-checkpoint]");
        if (response) {
          const ticket = state.generation;
          const selected = state.selected;
          const message = $("#checkpointAnswer").value.trim();
          if (!message) return;
          response.disabled = true;
          try {
            const result = await api(
              base + "/tasks/" + encodeURIComponent(response.dataset.task) +
                "/steps/" + encodeURIComponent(response.dataset.step) +
                "/respond",
              {
                method: "POST",
                body: JSON.stringify({ message, resume: true }),
              },
            );
            delete state.checkpointDrafts[
              `${response.dataset.checkpoint}:${response.dataset.step}`
            ];
            if (
              current(ticket) && state.path === "/inbox" &&
              state.selected === selected
            ) {
              await loadInbox(ticket);
              if (current(ticket)) {
                status(
                  result.resume_status ||
                    "응답을 저장했습니다. 실행 상태를 확인하세요.",
                  "success",
                );
              }
            }
          } catch (e) {
            if (current(ticket) && state.selected === selected) {
              const result = $("#actionResult");
              if (result) result.textContent = errorText(e);
              response.disabled = false;
            }
          }
          return;
        }
        const artifact = event.target.closest("[data-artifact]");
        if (artifact) {
          showArtifact(artifact.dataset.artifact);
          return;
        }
        const review = event.target.closest("[data-review]");
        if (review) {
          const ticket = state.generation;
          const runId = state.run?.run?.id;
          if (!runId) return;
          review.disabled = true;
          try {
            const r = await api(
              base + "/runs/" + encodeURIComponent(runId) +
                "/review",
              {
                method: "PUT",
                body: JSON.stringify({
                  reviewed: review.dataset.review === "true",
                }),
              },
            );
            if (
              !current(ticket) || state.run?.run?.id !== runId ||
              !review.isConnected
            ) return;
            state.run.review = r.review;
            review.textContent = r.review?.reviewed
              ? "검토 취소"
              : "검토 완료 기록";
            review.dataset.review = r.review?.reviewed ? "false" : "true";
            review.previousElementSibling.textContent = r.review?.reviewed
              ? "검토됨 · " + date(r.review.reviewed_at)
              : "검토 전";
          } catch (e) {
            if (current(ticket) && state.run?.run?.id === runId) {
              $("#runActionResult").textContent = errorText(e);
            }
          } finally {
            if (
              current(ticket) && state.run?.run?.id === runId &&
              review.isConnected
            ) review.disabled = false;
          }
          return;
        }
        if (event.target.closest("[data-continue]")) {
          const button = event.target.closest("[data-continue]");
          const ticket = state.generation;
          const runId = state.run?.run?.id;
          if (!runId) return;
          button.disabled = true;
          try {
            await api(
              base + "/runs/" + encodeURIComponent(runId) +
                "/resume",
              { method: "POST" },
            );
            if (current(ticket) && state.run?.run?.id === runId) {
              $("#runActionResult").textContent =
                "이어가기 요청 완료. 실행 상태를 다시 확인하세요.";
            }
          } catch (e) {
            if (
              current(ticket) && state.run?.run?.id === runId &&
              button.isConnected
            ) {
              $("#runActionResult").textContent = errorText(e);
              button.disabled = false;
            }
          }
          return;
        }
        if (event.target.id === "browserSetup") {
          openAutomation("setup");
          return;
        }
        const settings = event.target.closest("[data-settings]");
        if (settings) {
          openSettings(settings.dataset.settings);
          return;
        }
      });
      document.addEventListener("change", (event) => {
        if (event.target.id === "projectSelect") {
          saveVisibleDraft(state.project);
          state.project = event.target.value;
          renderProjects(false);
          loadProjectItems(state.project, state.generation);
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.dataset.draft) {
          state.checkpointDrafts[event.target.dataset.draft] =
            event.target.value;
        }
        if (event.target.id === "taskTitle") {
          draftFor(state.project).title = event.target.value;
        }
        if (event.target.id === "taskDescription") {
          draftFor(state.project).description = event.target.value;
        }
      });
      document.addEventListener("submit", (event) => {
        if (event.target.id === "taskForm") {
          event.preventDefault();
          submitTask();
        }
      });
      $("#refresh").addEventListener("click", () => renderRoute());
      renderRoute();
    </script>
  </body>
</html>
